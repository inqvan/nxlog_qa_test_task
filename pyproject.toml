[project]
name = "nxlog-qa-test-task"
version = "0.1.0"
description = "Test task: Playwright + Pytest + Allure tests for the TodoMVC demo application"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.48",
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "allure-pytest>=2.13",
    "pydantic-settings>=2.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "ui: UI tests using Playwright",
]
addopts = "--alluredir=allure-results --slowmo=1000"
